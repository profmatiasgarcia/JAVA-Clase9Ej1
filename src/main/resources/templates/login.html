<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Iniciar sesión | MEG-Spa</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap"
              rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-spa sticky-top">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">MEG-Spa</a>
                <a class="btn btn-spa-borde" th:href="@{/}">Volver al inicio</a>
            </div>
        </nav>

        <header class="banner-login">
            <div class="container text-center">
                <h1>Iniciar sesión</h1>
                <p class="lead mb-0">Ingresá para reservar tu turno.</p>
            </div>
        </header>

        <main class="login-contenedor">
            <div class="container" style="max-width: 480px">
                <div class="login-card">

                    <div class="alert alert-success"
                         th:if="${param.registrado}">
                        Cuenta creada. Ya podés iniciar sesión.
                    </div>

                    <div class="alert alert-success"
                         th:if="${param.logout}">
                        Cerraste sesión correctamente.
                    </div>

                    <div class="alert alert-danger"
                         th:if="${param.error}">
                        Email o contraseña incorrectos.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   autocomplete="username"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                Contraseña
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   autocomplete="current-password"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-spa w-100">
                            Ingresar
                        </button>
                    </form>

                    <p class="mt-4 mb-0 text-center">
                        ¿Todavía no tenés cuenta?
                        <a class="enlace-spa" th:href="@{/registro}">Registrate</a>
                    </p>
                </div>
            </div>
        </main>

        <footer class="footer-spa text-center py-4">
            <p class="mb-0">MEG-Spa Turnos · Sistema de reservas de masajes</p>
        </footer>

    </body>
</html>
