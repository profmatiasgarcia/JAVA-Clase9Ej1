<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mis reservas | MEG-Spa</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap"
              rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-spa sticky-top">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">MEG-Spa</a>
                <a class="btn btn-spa" th:href="@{/reservas/nueva}">
                    Nuevo turno
                </a>
            </div>
        </nav>

        <header class="banner-login">
            <div class="container text-center">
                <h1>Mis reservas</h1>
                <p class="lead mb-0">Revisá tus turnos y su estado.</p>
            </div>
        </header>

        <main class="login-contenedor">
            <div class="container" style="max-width: 960px">
                <div class="login-card">

                    <div class="alert alert-success"
                         th:if="${mensaje}"
                         th:text="${mensaje}">
                        Operación realizada.
                    </div>

                    <div class="alert alert-info"
                         th:if="${#lists.isEmpty(reservas)}">
                        Todavía no hay reservas para este cliente.
                    </div>

                    <div class="table-responsive"
                         th:unless="${#lists.isEmpty(reservas)}">

                        <table class="table tabla-spa align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Tratamiento</th>
                                    <th>Masajista</th>
                                    <th>Precio</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="reserva : ${reservas}">
                                    <td th:text="${#temporals.format(
                                        reserva.fechaHoraInicio, 'dd/MM/yyyy HH:mm')}">
                                    </td>

                                    <td th:text="${reserva.tipoMasaje.nombre}"></td>

                                    <td th:text="${reserva.masajista.nombre}"></td>

                                    <td th:text="${'$ ' +
                                        #numbers.formatDecimal(
                                        reserva.precioAplicado, 1, 2, 'COMMA')}">
                                    </td>

                                    <td>
                                        <span class="badge badge-spa"
                                              th:text="${reserva.estado}">
                                        </span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="text-center mt-4">
                        <a class="btn btn-spa" th:href="@{/reservas/nueva}">
                            Solicitar otro turno
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer-spa text-center py-4">
            <p class="mb-0">MEG-Spa Turnos · Sistema de reservas de masajes</p>
        </footer>

    </body>
</html>
