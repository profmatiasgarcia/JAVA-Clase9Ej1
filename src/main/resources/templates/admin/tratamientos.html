<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Administrar tratamientos | MEG-Spa</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap"
              rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-spa sticky-top">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    MEG-Spa <span class="fs-6 text-secondary">· Administración</span>
                </a>

                <div class="d-flex align-items-center gap-2">
                    <a class="btn btn-spa-borde btn-sm" th:href="@{/admin}">
                        Volver al panel
                    </a>
                    <a class="btn btn-spa btn-sm"
                       th:href="@{/admin/tratamientos/nuevo}">
                        Nuevo tratamiento
                    </a>
                </div>
            </div>
        </nav>

        <header class="banner-login">
            <div class="container text-center">
                <h1>Tratamientos</h1>
                <p class="lead mb-0">Administrá los masajes que ofrece el spa.</p>
            </div>
        </header>

        <main class="login-contenedor">
            <div class="container" style="max-width: 1100px">
                <div class="login-card">

                    <div th:if="${mensaje}" class="alert alert-success"
                         th:text="${mensaje}"></div>

                    <div th:if="${error}" class="alert alert-danger"
                         th:text="${error}"></div>

                    <div class="table-responsive">
                        <table class="table tabla-spa align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Duración</th>
                                    <th>Precio</th>
                                    <th>Estado</th>
                                    <th class="acciones">Acciones</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="tratamiento : ${tratamientos}">
                                    <td>
                                        <strong th:text="${tratamiento.nombre}"></strong>
                                        <div class="small text-secondary"
                                             th:text="${tratamiento.descripcion}"></div>
                                    </td>

                                    <td>
                                        <span th:text="${tratamiento.duracionMinutos}"></span>
                                        min
                                    </td>

                                    <td>
                                        $ <span th:text="${#numbers.formatDecimal(
                                            tratamiento.precio, 1, 2)}"></span>
                                    </td>

                                    <td>
                                        <span th:if="${tratamiento.activo}"
                                              class="badge badge-spa estado-realizada">Activo</span>
                                        <span th:unless="${tratamiento.activo}"
                                              class="badge badge-spa estado-inactivo">Inactivo</span>
                                    </td>

                                    <td>
                                        <div class="d-flex flex-wrap gap-2">
                                            <a th:href="@{/admin/tratamientos/{id}/editar(
                                                id=${tratamiento.id})}"
                                               class="btn btn-spa-borde btn-sm">
                                                Editar
                                            </a>

                                            <form th:if="${tratamiento.activo}"
                                                  th:action="@{/admin/tratamientos/{id}/desactivar(
                                                      id=${tratamiento.id})}"
                                                  method="post" class="m-0">
                                                <button type="submit"
                                                        class="btn btn-spa-peligro btn-sm">
                                                    Desactivar
                                                </button>
                                            </form>

                                            <form th:unless="${tratamiento.activo}"
                                                  th:action="@{/admin/tratamientos/{id}/activar(
                                                      id=${tratamiento.id})}"
                                                  method="post" class="m-0">
                                                <button type="submit"
                                                        class="btn btn-spa btn-sm">
                                                    Activar
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(tratamientos)}">
                                    <td colspan="5" class="text-center text-secondary py-5">
                                        Todavía no hay tratamientos registrados.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer-spa text-center py-4">
            <p class="mb-0">MEG-Spa Turnos · Sistema de reservas de masajes</p>
        </footer>

    </body>
</html>
