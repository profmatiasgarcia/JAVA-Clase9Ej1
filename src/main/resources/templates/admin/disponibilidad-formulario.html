<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${(form.id == null ? 'Nuevo horario' : 'Editar horario') + ' | MEG-Spa'}">
            Horario | MEG-Spa
        </title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap"
              rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-spa sticky-top">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    MEG-Spa <span class="fs-6 text-secondary">· Administración</span>
                </a>
                <a class="btn btn-spa-borde btn-sm" th:href="@{/admin/disponibilidades}">
                    Volver a disponibilidades
                </a>
            </div>
        </nav>

        <header class="banner-login">
            <div class="container text-center">
                <h1 th:text="${form.id == null ? 'Nuevo horario' : 'Editar horario'}">
                    Nuevo horario
                </h1>
                <p class="lead mb-0">Definí cuándo atiende el masajista.</p>
            </div>
        </header>

        <main class="login-contenedor">
            <div class="container" style="max-width: 720px">
                <div class="login-card">

                    <div th:if="${error}" class="alert alert-danger"
                         th:text="${error}"></div>

                    <form th:action="@{/admin/disponibilidades/guardar}"
                          th:object="${form}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="masajistaId" class="form-label">Masajista</label>
                            <select id="masajistaId" th:field="*{masajistaId}"
                                    class="form-select" required>
                                <option value="">Seleccioná un masajista</option>
                                <option th:each="m : ${masajistas}"
                                        th:value="${m.id}"
                                        th:text="${m.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="diaSemana" class="form-label">Día de la semana</label>
                            <select id="diaSemana" th:field="*{diaSemana}"
                                    class="form-select" required>
                                <option value="">Seleccioná un día</option>
                                <option th:each="dia : ${diasSemana}"
                                        th:value="${dia}"
                                        th:text="${dia}">
                                </option>
                            </select>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="horaDesde" class="form-label">Hora desde</label>
                                <input id="horaDesde" type="time"
                                       th:field="*{horaDesde}"
                                       class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label for="horaHasta" class="form-label">Hora hasta</label>
                                <input id="horaHasta" type="time"
                                       th:field="*{horaHasta}"
                                       class="form-control" required>
                            </div>
                        </div>

                        <p class="text-secondary small mt-3 mb-4">
                            La hora de fin debe ser posterior a la de inicio.
                            No se permiten franjas superpuestas para el mismo masajista y día.
                        </p>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-spa">Guardar</button>
                            <a th:href="@{/admin/disponibilidades}"
                               class="btn btn-spa-borde">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="footer-spa text-center py-4">
            <p class="mb-0">MEG-Spa Turnos · Sistema de reservas de masajes</p>
        </footer>

    </body>
</html>
