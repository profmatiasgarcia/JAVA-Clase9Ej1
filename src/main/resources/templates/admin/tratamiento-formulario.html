<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${titulo} + ' | MEG-Spa'">Tratamiento | MEG-Spa</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap"
              rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-spa sticky-top">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    MEG-Spa <span class="fs-6 text-secondary">· Administración</span>
                </a>
                <a class="btn btn-spa-borde btn-sm" th:href="@{/admin/tratamientos}">
                    Volver a tratamientos
                </a>
            </div>
        </nav>

        <header class="banner-login">
            <div class="container text-center">
                <h1 th:text="${titulo}">Tratamiento</h1>
                <p class="lead mb-0">Completá los datos del masaje.</p>
            </div>
        </header>

        <main class="login-contenedor">
            <div class="container" style="max-width: 760px">
                <div class="login-card">

                    <div th:if="${error}" class="alert alert-danger"
                         th:text="${error}"></div>

                    <form th:action="@{/admin/tratamientos/guardar}"
                          th:object="${tratamiento}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre
                            </label>
                            <input id="nombre" type="text"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">
                                Descripción
                            </label>
                            <textarea id="descripcion"
                                      th:field="*{descripcion}"
                                      class="form-control"
                                      rows="4" maxlength="500"></textarea>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="duracionMinutos" class="form-label">
                                    Duración en minutos
                                </label>
                                <input id="duracionMinutos" type="number"
                                       th:field="*{duracionMinutos}"
                                       class="form-control"
                                       min="1" required>
                            </div>

                            <div class="col-md-6">
                                <label for="precio" class="form-label">
                                    Precio
                                </label>
                                <input id="precio" type="number"
                                       th:field="*{precio}"
                                       class="form-control"
                                       min="0" step="0.01" required>
                            </div>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-spa">
                                Guardar
                            </button>

                            <a th:href="@{/admin/tratamientos}"
                               class="btn btn-spa-borde">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="footer-spa text-center py-4">
            <p class="mb-0">MEG-Spa Turnos · Sistema de reservas de masajes</p>
        </footer>

    </body>
</html>
