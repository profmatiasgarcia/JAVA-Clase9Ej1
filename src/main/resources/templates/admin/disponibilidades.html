<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Disponibilidades | MEG-Spa</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap"
              rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-spa sticky-top">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    MEG-Spa <span class="fs-6 text-secondary">· Administración</span>
                </a>

                <div class="d-flex align-items-center gap-2">
                    <a class="btn btn-spa-borde btn-sm" th:href="@{/admin}">
                        Volver al panel
                    </a>
                    <a class="btn btn-spa btn-sm"
                       th:href="@{/admin/disponibilidades/nuevo}">
                        Nuevo horario
                    </a>
                </div>
            </div>
        </nav>

        <header class="banner-login">
            <div class="container text-center">
                <h1>Disponibilidades</h1>
                <p class="lead mb-0">Horarios de atención de cada masajista.</p>
            </div>
        </header>

        <main class="login-contenedor">
            <div class="container" style="max-width: 1100px">
                <div class="login-card">

                    <div th:if="${mensaje}" class="alert alert-success"
                         th:text="${mensaje}"></div>

                    <div th:if="${error}" class="alert alert-danger"
                         th:text="${error}"></div>

                    <div class="table-responsive">
                        <table class="table tabla-spa align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Masajista</th>
                                    <th>Día</th>
                                    <th>Desde</th>
                                    <th>Hasta</th>
                                    <th>Estado</th>
                                    <th class="acciones">Acciones</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="d : ${disponibilidades}">
                                    <td>
                                        <strong th:text="${d.masajista.nombre}"></strong>
                                    </td>

                                    <td th:text="${d.diaSemana}"></td>

                                    <td th:text="${d.horaDesde}"></td>

                                    <td th:text="${d.horaHasta}"></td>

                                    <td>
                                        <span th:if="${d.vigente}"
                                              class="badge badge-spa estado-realizada">Vigente</span>
                                        <span th:unless="${d.vigente}"
                                              class="badge badge-spa estado-inactivo">Desactivada</span>
                                    </td>

                                    <td>
                                        <div class="d-flex flex-wrap gap-2">
                                            <a th:if="${d.vigente}"
                                               th:href="@{/admin/disponibilidades/{id}/editar(id=${d.id})}"
                                               class="btn btn-spa-borde btn-sm">
                                                Editar
                                            </a>

                                            <form th:if="${d.vigente}"
                                                  th:action="@{/admin/disponibilidades/{id}/desactivar(id=${d.id})}"
                                                  method="post" class="m-0"
                                                  onsubmit="return confirm('¿Desactivar este horario?');">
                                                <button class="btn btn-spa-peligro btn-sm"
                                                        type="submit">
                                                    Desactivar
                                                </button>
                                            </form>

                                            <form th:unless="${d.vigente}"
                                                  th:action="@{/admin/disponibilidades/{id}/activar(id=${d.id})}"
                                                  method="post" class="m-0">
                                                <button class="btn btn-spa btn-sm"
                                                        type="submit">
                                                    Reactivar
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(disponibilidades)}">
                                    <td colspan="6" class="text-center text-secondary py-5">
                                        No hay disponibilidades registradas.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer-spa text-center py-4">
            <p class="mb-0">MEG-Spa Turnos · Sistema de reservas de masajes</p>
        </footer>

    </body>
</html>
