<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${titulo} + ' | MEG-Spa'">Masajista | MEG-Spa</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap"
              rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-spa sticky-top">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    MEG-Spa <span class="fs-6 text-secondary">· Administración</span>
                </a>
                <a class="btn btn-spa-borde btn-sm" th:href="@{/admin/masajistas}">
                    Volver a masajistas
                </a>
            </div>
        </nav>

        <header class="banner-login">
            <div class="container text-center">
                <h1 th:text="${titulo}">Masajista</h1>
                <p class="lead mb-0">Completá los datos del profesional.</p>
            </div>
        </header>

        <main class="login-contenedor">
            <div class="container" style="max-width: 760px">
                <div class="login-card">

                    <div th:if="${error}" class="alert alert-danger"
                         th:text="${error}"></div>

                    <form th:action="@{/admin/masajistas/guardar}"
                          th:object="${masajista}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input id="nombre" type="text"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   maxlength="150" required>
                        </div>

                        <div class="mb-4">
                            <label for="telefono" class="form-label">
                                Teléfono (opcional)
                            </label>
                            <input id="telefono" type="tel"
                                   th:field="*{telefono}"
                                   class="form-control"
                                   maxlength="30">
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-spa">
                                Guardar
                            </button>

                            <a th:href="@{/admin/masajistas}"
                               class="btn btn-spa-borde">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="footer-spa text-center py-4">
            <p class="mb-0">MEG-Spa Turnos · Sistema de reservas de masajes</p>
        </footer>

    </body>
</html>
