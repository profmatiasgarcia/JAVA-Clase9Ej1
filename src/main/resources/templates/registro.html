<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Crear cuenta | MEG-Spa</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap"
              rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-spa sticky-top">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">MEG-Spa</a>
                <a class="btn btn-spa-borde" th:href="@{/}">Volver al inicio</a>
            </div>
        </nav>

        <header class="banner-login">
            <div class="container text-center">
                <h1>Crear cuenta</h1>
                <p class="lead mb-0">Registrate para reservar tus turnos.</p>
            </div>
        </header>

        <main class="login-contenedor">
            <div class="container" style="max-width: 520px">
                <div class="login-card">

                    <div class="alert alert-danger"
                         th:if="${error != null}"
                         th:text="${error}">
                        No se pudo completar el registro.
                    </div>

                    <form th:action="@{/registro}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text"
                                   class="form-control"
                                   id="nombre"
                                   name="nombre"
                                   maxlength="100"
                                   autocomplete="name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   maxlength="150"
                                   autocomplete="email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel"
                                   class="form-control"
                                   id="telefono"
                                   name="telefono"
                                   maxlength="30"
                                   autocomplete="tel">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   minlength="12"
                                   maxlength="72"
                                   autocomplete="new-password"
                                   required>
                            <div class="form-text">
                                Utilizá al menos 12 caracteres.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-spa w-100">
                            Registrarme
                        </button>
                    </form>

                    <p class="mt-4 mb-0 text-center">
                        ¿Ya tenés cuenta?
                        <a class="enlace-spa" th:href="@{/login}">Iniciar sesión</a>
                    </p>
                </div>
            </div>
        </main>

        <footer class="footer-spa text-center py-4">
            <p class="mb-0">MEG-Spa Turnos · Sistema de reservas de masajes</p>
        </footer>

    </body>
</html>
