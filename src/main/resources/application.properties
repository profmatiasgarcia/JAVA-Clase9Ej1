spring.application.name=turnos

spring.datasource.url=jdbc:mariadb://localhost:3306/megspa_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=adminmegspa
spring.datasource.password=admin
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuraci\u00f3n de Hibernate para que gestione las tablas autom\u00e1ticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect